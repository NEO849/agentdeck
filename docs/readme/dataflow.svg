<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="1400" height="640" role="img" aria-labelledby="flow-title flow-desc" font-family='ui-monospace,"SF Mono",Menlo,"JetBrains Mono","Cascadia Mono",Consolas,monospace'>
<title id="flow-title">agentdeck Datenfluss</title><desc id="flow-desc">Drei live Quellen werden in collect über die session_id gejoint, in render zu ANSI mit Glyphen gesetzt und ergeben alle zwei Sekunden einen Frame der linken Sidebar.</desc>
<defs>
