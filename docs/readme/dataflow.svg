<text x="40" y="100" font-size="13.5" fill="#9aa39c">Read-only Join dreier Quellen, neu gezeichnet alle 2 Sekunden.</text>
<g transform="translate(0,34)"><path d="M380 150 H412 Q420 150 420 158 V207 Q420 215 428 215 H452" fill="none" stroke="#9aa39c" stroke-width="1.5" marker-end="url(#flow-a)"/><line x1="380" y1="320" x2="452" y2="320" stroke="#9aa39c" stroke-width="1.5" marker-end="url(#flow-a)"/><path d="M380 490 H412 Q420 490 420 482 V433 Q420 425 428 425 H452" fill="none" stroke="#9aa39c" stroke-width="1.5" marker-end="url(#flow-a)"/><line x1="780" y1="320" x2="848" y2="320" stroke="#3dd68c" stroke-width="1.75" marker-end="url(#flow-g)"/><line x1="1100" y1="320" x2="1168" y2="320" stroke="#3dd68c" stroke-width="1.75" marker-end="url(#flow-g)"/><rect x="776" y="291" width="75" height="20" fill="#0b0d0c"/><text x="814" y="306" font-size="10.5" font-weight="600" fill="#808a84" text-anchor="middle" letter-spacing="1">ROHDATEN</text><rect x="1096" y="291" width="75" height="20" fill="#0b0d0c"/><text x="1134" y="306" font-size="10.5" font-weight="600" fill="#3dd68c" text-anchor="middle" letter-spacing="1">ALLE 2 S</text><rect x="40" y="110" width="340" height="100" rx="6" fill="#121614"/><rect x="40" y="110" width="340" height="100" rx="6" fill="none" stroke="rgba(255,255,255,.11)" stroke-width="1.25"/><line x1="48" y1="111" x2="372" y2="111" stroke="rgba(255,255,255,.07)"/><text x="58" y="144" font-size="14.5" font-weight="600" fill="#e6ebe7" text-anchor="start">tmux list-panes -a</text><text x="58" y="168" font-size="12" font-weight="400" fill="#9aa39c" text-anchor="start">→ @pane_* (Status, Attention, Agent)</text><text x="58" y="190" font-size="11.5" font-weight="400" fill="#808a84" text-anchor="start">live gelesen, nur lesend</text><rect x="40" y="250" width="340" height="100" rx="6" fill="#121614"/><rect x="40" y="250" width="340" height="100" rx="6" fill="none" stroke="rgba(255,255,255,.11)" stroke-width="1.25"/><line x1="48" y1="251" x2="372" y2="251" stroke="rgba(255,255,255,.07)"/><text x="58" y="284" font-size="14.5" font-weight="600" fill="#e6ebe7" text-anchor="start">~/.claude/sessions/*.json</text><text x="58" y="308" font-size="12" font-weight="400" fill="#9aa39c" text-anchor="start">→ Session → Pane / Name</text><text x="58" y="330" font-size="11.5" font-weight="400" fill="#808a84" text-anchor="start">live gelesen, nur lesend</text><rect x="40" y="390" width="340" height="100" rx="6" fill="#121614"/><rect x="40" y="390" width="340" height="100" rx="6" fill="none" stroke="rgba(255,255,255,.11)" stroke-width="1.25"/><line x1="48" y1="391" x2="372" y2="391" stroke="rgba(255,255,255,.07)"/><text x="58" y="424" font-size="14.5" font-weight="600" fill="#e6ebe7" text-anchor="start">Transcript-Tail</text><text x="58" y="448" font-size="12" font-weight="400" fill="#9aa39c" text-anchor="start">→ Modell der Session</text><text x="58" y="470" font-size="11.5" font-weight="400" fill="#808a84" text-anchor="start">live gelesen, nur lesend</text><rect x="460" y="170" width="320" height="310" rx="6" fill="#121614"/><rect x="460" y="170" width="320" height="310" rx="6" fill="none" stroke="rgba(255,255,255,.11)" stroke-width="1.25"/><line x1="468" y1="171" x2="772" y2="171" stroke="rgba(255,255,255,.07)"/><text x="480" y="204" font-size="18" font-weight="700" fill="#e6ebe7" text-anchor="start">collect</text><rect x="480" y="216" width="43" height="20" rx="2" fill="none" stroke="rgba(255,255,255,.11)"/><text x="487" y="230" font-size="10.5" font-weight="600" fill="#808a84" text-anchor="start" letter-spacing="1">JOIN</text><rect x="480" y="270" width="280" height="52" rx="4" fill="#1a1f1c" stroke="rgba(255,255,255,.11)"/><text x="494" y="292" font-size="13" font-weight="600" fill="#e6ebe7" text-anchor="start">Join über session_id</text><rect x="480" y="334" width="280" height="52" rx="4" fill="#1a1f1c" stroke="rgba(255,255,255,.11)"/><text x="494" y="356" font-size="13" font-weight="600" fill="#e6ebe7" text-anchor="start">Handlungsbedarf =</text><text x="494" y="374" font-size="12" font-weight="400" fill="#9aa39c" text-anchor="start">attention == notification</text><rect x="480" y="398" width="280" height="52" rx="4" fill="#1a1f1c" stroke="rgba(255,255,255,.11)"/><text x="494" y="420" font-size="13" font-weight="600" fill="#e6ebe7" text-anchor="start">Sortierung:</text><text x="494" y="438" font-size="12" font-weight="400" fill="#9aa39c" text-anchor="start">Aktion → aktiv → idle</text><rect x="860" y="220" width="240" height="200" rx="6" fill="#121614"/><rect x="860" y="220" width="240" height="200" rx="6" fill="rgba(61,214,140,.12)"/><rect x="860" y="220" width="240" height="200" rx="6" fill="none" stroke="rgba(61,214,140,.55)" stroke-width="1.5"/><line x1="868" y1="221" x2="1092" y2="221" stroke="rgba(255,255,255,.07)"/><text x="880" y="254" font-size="18" font-weight="700" fill="#3dd68c" text-anchor="start">render</text><rect x="880" y="266" width="43" height="20" rx="2" fill="none" stroke="rgba(61,214,140,.55)"/><text x="887" y="280" font-size="10.5" font-weight="600" fill="#3dd68c" text-anchor="start" letter-spacing="1">ANSI</text><text x="880" y="316" font-size="13" font-weight="600" fill="#e6ebe7" text-anchor="start">ANSI + Glyphen</text><text x="880" y="338" font-size="15"><tspan fill="#3dd68c">●</tspan><tspan fill="#d6ad55" dx="8">▲</tspan><tspan fill="#808a84" dx="8">○</tspan><tspan fill="#e0574d" dx="8">■</tspan></text><text x="880" y="366" font-size="12.5" font-weight="400" fill="#9aa39c" text-anchor="start">NO_COLOR-fähig</text><rect x="1180" y="170" width="180" height="300" rx="6" fill="#121614"/><rect x="1180" y="170" width="180" height="300" rx="6" fill="rgba(61,214,140,.12)"/><rect x="1180" y="170" width="180" height="300" rx="6" fill="none" stroke="rgba(61,214,140,.55)" stroke-width="1.5"/><line x1="1188" y1="171" x2="1352" y2="171" stroke="rgba(255,255,255,.07)"/><text x="1198" y="204" font-size="17" font-weight="700" fill="#3dd68c" text-anchor="start">ein Frame</text><text x="1198" y="224" font-size="12" font-weight="400" fill="#9aa39c" text-anchor="start">linke Sidebar</text><rect x="1196" y="