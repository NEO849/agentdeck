<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="1400" height="640" role="img" aria-labelledby="arch-title arch-desc" font-family='ui-monospace,"SF Mono",Menlo,"JetBrains Mono","Cascadia Mono",Consolas,monospace'>
<title id="arch-title">agentdeck Architektur</title><desc id="arch-desc">Claude-Code-Hooks schreiben in einen geteilten State-Bus aus tmux-Optionen und Session-Dateien; der agentdeck Deck und die hiroppy Sidebar lesen ihn parallel.</desc>
<defs>
<pattern id="arch-weave" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="rgba(255,255,255,.018)"/><rect x="3" y="3" width="3" height="3" fill="rgba(255,255,255,.018)"/></pattern>
<marker id="arch-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9aa39c" stroke-width="1.6"/></marker>
<marker id="arch-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#3dd68c" stroke-width="1.6"/></marker>
</defs>
<rect width="1400" height="640" fill="#0b0d0c"/><rect width="1400" height="640" fill="url(#arch-weave)"/>
<text x="40" y="44" font-size="12" letter-spacing="2" fill="#808a84">ARCHITEKTUR</text>
<text x="40" y="76" font-size="24" font-weight="700" fill="#e6ebe7">Ein State-Bus, zwei Leser</text>
<text x="40" y="100" font-size="13.5" fill="#9aa39c">Hooks schreiben, Deck und Sidebar lesen. Der Deck ist ein read-only Join über live Quellen.</text>
<line x1="340" y1="320" x2="508" y2="320" stroke="#9aa39c" stroke-width="1.5" marker-end="url(#arch-a)"/><line x1="880" y1="215" x2="1048" y2="215" stroke="#3dd68c" stroke-width="1.75" marker-end="url(#arch-g)"/><line x1="880" y1="445" x2="1048" y2="445" stroke="#9aa39c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arch-a)"/><rect x="383" y="291" width="83" height="20" fill="#0b0d0c"/><text x="424" y="306" font-size="10.5" font-weight="600" fill="#808a84" text-anchor="middle" letter-spacing="1">SCHREIBEN</text><rect x="938" y="186" width="53" height="20" fill="#0b0d0c"/><text x="964" y="201" font-size="10.5" font-weight="600" fill="#3dd68c" text-anchor="middle" letter-spacing="1">LIEST</text><rect x="938" y="416" width="53" height="20" fill="#0b0d0c"/><text x="964" y="431" font-size="10.5" font-weight="600" fill="#808a84" text-anchor="middle" letter-spacing="1">LIEST</text><rect x="40" y="190" width="300" height="260" rx="6" fill="#121614"/><rect x="40" y="190" width="300" height="260" rx="6" fill="none" stroke="rgba(255,255,255,.11)" stroke-width="1.25"/><line x1="48" y1="191" x2="332" y2="191" stroke="rgba(255,255,255,.07)"/><text x="60" y="222" font-size="17" font-weight="700" fill="#e6ebe7" text-anchor="start">Claude Code Hooks</text><text x="60" y="242" font-size="11.5" font-weight="400" fill="#808a84" text-anchor="start">~/.claude/settings.json</text><rect x="60" y="262" width="260" height="26" rx="2" fill="#1a1f1c" stroke="rgba(255,255,255,.11)"/><text x="72" y="280" font-size="13" font-weight="400" fill="#9aa39c" text-anchor="start">SessionStart</text><rect x="60" y="296" width="260" height="26" rx="2" fill="#1a1f1c" stroke="rgba(255,255,255,.11)"/><text x="72" y="314" font-size="13" font-weight="400" fill="#9aa39c" text-anchor="start">Notification</text><rect x="60" y="330" width="260" height="26" rx="2" fill="#1a1f1c" stroke="rgba(255,255,255,.11)"/><text x="72" y="348" font-size="13" font-weight="400" fill="#9aa39c" text-anchor="start">Stop</text><rect x="60" y="364" width="260" height="26" rx="2" fill="#1a1f1c" stroke="rgba(255,255,255,.11)"/><text x="72" y="382" font-size="13" font-weight="400" fill="#9aa39c" text-anchor="start">SubagentStart / Stop</text><rect x="60" y="398" width="260" height="26" rx="2" fill="#1a1f1c" stroke="rgba(255,255,255,.11)"/><text x="72" y="416" font-size="13" font-weight="400" fill="#9aa39c" text-anchor="start">PermissionDenied</text><rect x="520" y="150" width="360" height="340" rx="6" fill="#121614"/><rect x="520" y="150" width="360" height="340" rx="6" fill="#151a17"/><rect x="520" y="150" width="360" height="340" rx="6" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1.25"/><line x1="528" y1="151" x2="872" y2="151" stroke="rgba(255,255,255,.07)"/><text x="540" y="182" font-size="17" font-weight="700" fill="#e6ebe7" text-anchor="start">State-Bus</text><text x="540" y="202" font-size="11.5" font-weight="400" fill="#808a84" text-anchor="start">geteilt, live, ein Schreiber-Pfad</text><rect x="540" y="214" width="320" height="108" rx="4" fill="#1a1f1c" stroke="rgba(255,255,255,.11)"/><text x="556" y="244" font-size="14.5" font-weight="600" fill="#e6ebe7" text-anchor="start">@pane_* tmux-Optionen</text><text x="556" y="266" font-size="12" font-weight="400" fill="#9aa39c" text-anchor="start">Status · Attention · Agent</text><text x="556" y="286" font-size="12" font-weight="400" fill="#808a84" text-anchor="start">pro Pane, von den Hooks befüllt</text><rect x="540" y="340" width="320" height="108" rx="4" fill="#1a1f1c" stroke="rgba(255,255,255,.11)"/><text x="556" y="370" font-size="14.5" font-weight="600" fill="#e6ebe7" text-anchor="start">~/.claude/sessions/*.json</text><text x="556" y="392" font-size="12" font-weight="400" fill="#9aa39c" text-anchor="start">Session → Pane · Name · Status</text><text x="556" y="412" font-size="12" font-weight="400" fill="#808a84" text-anchor="start">eine Datei pro Claude-Session</text><rect x="1060" y="110" width="300" height="230" rx="6" fill="#121614"/><rect x="1060" y="110" width="300" height="230" rx="6" fill="rgba(61,214,140,.12)"/><rect x="1060" y="110" width="300" height="230" rx="6" fill="none" stroke="rgba(61,214,140,.55)" stroke-width="1.5"/><line x1="1068" y1="111" x2="1352" y2="111" stroke="rgba(255,255,255,.07)"/><text x="1080" y="142" font-size="17" font-weight="700" fill="#3dd68c" text-anchor="start">agentdeck deck</text><rect x="1080" y="152" width="72" height="20" rx="2" fill="none" stroke="rgba(61,214,140,.55)"/><text x="1087" y="166" font-size="10.5" font-weight="600" fill="#3dd68c" text-anchor="start" letter-spacing="1">prefix+e</text><text x="1080" y="198" font-size="12.5" font-weight="400" fill="#e6ebe7" text-anchor="start">linke Sidebar, alle Sessions</text><text x="1080" y="218" font-size="12.5" font-weight="400" fill="#e6ebe7" text-anchor="start">Handlungsbedarf zuerst</text><rect x="1080" y="248" width="260" height="68" rx="4" fill="#121614" stroke="rgba(61,214,140,.55)" stroke-dasharray="4,3"/><text x="1094" y="274" font-size="13.5" font-weight="600" fill="#e6ebe7" text-anchor="start">Transcript-Tail</text><text x="1094" y="296" font-size="12" font-weight="400" fill="#9aa39c" text-anchor="start">liest zusätzlich: Modell</text><rect x="1060" y="380" width="300" height="130" rx="6" fill="#121614"/><rect x="1060" y="380" width="300" height="130" rx="6" fill="none" stroke="rgba(255,255,255,.11)" stroke-width="1.25"/><line x1="1068" y1="381" x2="1352" y2="381" stroke="rgba(255,255,255,.07)"/><text x="1080" y="412" font-size="17" font-weight="700" fill="#e6ebe7" text-anchor="start">hiroppy sidebar</text><rect x="1080" y="422" width="72" height="20" rx="2" fill="none" stroke="rgba(255,255,255,.11)"/><text x="1087" y="436" font-size="10.5" font-weight="600" fill="#808a84" text-anchor="start" letter-spacing="1">prefix+E</text><text x="1080" y="478" font-size="12.5" font-weight="400" fill="#9aa39c" text-anchor="start">tmux-agent-sidebar</text><text x="1080" y="497" font-size="12" font-weight="400" fill="#808a84" text-anchor="start">bestehender Weg, unverändert</text><line x1="40" y1="574" x2="1360" y2="574" stroke="rgba(255,255,255,.11)"/><rect x="40" y="588" width="22" height="14" rx="2" fill="rgba(61,214,140,.12)" stroke="rgba(61,214,140,.55)"/><text x="72" y="600" font-size="12" font-weight="400" fill="#9aa39c" text-anchor="start">neuer Weg: Deck</text><rect x="219.0" y="588" width="22" height="14" rx="2" fill="#121614" stroke="rgba(255,255,255,.11)"/><text x="251.0" y="600" font-size="12" font-weight="400" fill="#9aa39c" text-anchor="start">bestehend / geteilt</text><line x1="427.6" y1="595" x2="449.6" y2="595" stroke="#9aa39c" stroke-width="1.5"/><text x="459.6" y="600" font-size="12" font-weight="400" fill="#9aa39c" text-anchor="start">Schreiben</text><line x1="562.2" y1="595" x2="584.2" y2="595" stroke="#9aa39c" stroke-width="1.5" stroke-dasharray="5,4"/><text x="594.2" y="600" font-size="12" font-weight="400" fill="#9aa39c" text-anchor="start">Lesen, passiv</text></svg>